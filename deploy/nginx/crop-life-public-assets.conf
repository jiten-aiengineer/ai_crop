# Vinext serves compiled framework assets itself. These are the original
# application/PWA assets, so Nginx serves them directly from the checked-out
# public directory rather than letting a missing public-asset route become a
# 404 page. Do not place private inspection or S3 content in this directory.
location ~ ^/(?:clsl-logo\.png|clsl-field-sprayer\.png|crop-life-mitra\.jpg|crop-life-mitra-cutout\.webp|crop-life-mitra-tomato-doctor\.jpg|favicon\.svg|manifest\.webmanifest|og\.png|sw\.js)$ {
    # Nginx runs as www-data and deliberately cannot traverse Ubuntu's home
    # directory. The deployment sync copies only this public asset directory
    # to /var/www/crop-life-ai-public.
    root /var/www/crop-life-ai-public;
    try_files $uri =404;
    access_log off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# Product pack images are public catalogue assets only. Product images stored
# privately in S3 continue through their authenticated application routes.
location ^~ /products/ {
    root /var/www/crop-life-ai-public;
    try_files $uri =404;
    access_log off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}
